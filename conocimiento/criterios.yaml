# Catálogo de criterios de evaluación de historias de usuario (HU).
#
# ÚNICA FUENTE DE VERDAD de las reglas. Agregar, cambiar o retirar un criterio es editar
# este archivo y nada más: ni código Python, ni SKILL.md, ni la política.
#
# Reglas de edición (las valida src/revisor/conocimiento/catalogo.py al cargar):
#   - Los ids son estables y NUNCA se reutilizan (formato: 2 a 5 letras, guion, 3 dígitos).
#   - Un criterio no se borra: se marca `estado: obsoleto` con `reemplazado_por: <id>`.
#   - `categoria` debe estar en `categorias`; cada valor de `aplica_a` debe estar en
#     `sistemas` (o ser exactamente [todos]).
#   - Un cambio después de congelar (tag 1.0.0) crea una versión nueva y se registra en
#     docs/DECISIONES.md: obliga a volver a etiquetar los casos afectados.
#
# ESTADO: BORRADOR v0. Se valida después con los líderes técnicos del banco.

version: "0.1.0"
fecha: 2026-11-09

categorias: [qus, invest, dor, banca_movil]
sistemas: [banca_movil, core]
tipos_hu: [funcional]

criterios:

  # ------------------------------------------------------------------ QUS (Lucassen et al., 2016)
  - id: QUS-001
    categoria: qus
    nombre: Bien formada
    descripcion: La HU tiene al menos un rol y una acción (medio), idealmente en la plantilla "Como <rol>, quiero <acción>, para <beneficio>".
    como_verificar: Identificar el rol (quién) y la acción (qué). Si falta cualquiera de los dos, no cumple.
    ejemplo_cumple: Como cliente, quiero consultar mi saldo, para saber cuánto puedo gastar.
    ejemplo_no_cumple: Actualizar la pantalla de saldos.
    severidad: bloqueante
    aplica_a: [todos]
    estado: activo

  - id: QUS-002
    categoria: qus
    nombre: Atómica
    descripcion: La HU expresa un solo requisito o característica; no mezcla varios objetivos.
    como_verificar: Buscar conjunciones que unen funcionalidades distintas ("y", "además", "también", listas). Si hay más de un objetivo que podría entregarse por separado, no cumple; la decisión suele ser dividir.
    ejemplo_cumple: Como cliente, quiero recibir una notificación push por cada transferencia, para detectar movimientos no reconocidos.
    ejemplo_no_cumple: Como cliente, quiero transferir, ver mi historial y exportarlo a PDF, para manejar mis finanzas.
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: QUS-003
    categoria: qus
    nombre: Mínima
    descripcion: La HU contiene solo rol, acción y beneficio; los detalles adicionales (notas, soluciones, comentarios) van en otro lugar, por ejemplo en los criterios de aceptación.
    como_verificar: Revisar si hay texto entre paréntesis, notas, listas de detalles o comentarios dentro del enunciado de la HU.
    ejemplo_cumple: Como cliente, quiero bloquear mi tarjeta desde la app, para evitar cargos si la pierdo.
    ejemplo_no_cumple: Como cliente, quiero bloquear mi tarjeta (ver correo del 3 de mayo, usar el servicio nuevo), para evitar cargos.
    severidad: menor
    aplica_a: [todos]
    estado: activo

  - id: QUS-004
    categoria: qus
    nombre: Conceptualmente sólida
    descripcion: La acción expresa una funcionalidad y el beneficio expresa una justificación real, no otra funcionalidad.
    como_verificar: Leer el "para…". Si describe otra funcionalidad en vez de un propósito o valor, no cumple.
    ejemplo_cumple: Como cliente, quiero guardar cuentas favoritas, para transferir más rápido a quienes pago seguido.
    ejemplo_no_cumple: Como cliente, quiero guardar cuentas favoritas, para poder editarlas y borrarlas.
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: QUS-005
    categoria: qus
    nombre: Orientada al problema
    descripcion: La HU describe el problema o la necesidad, no la solución técnica.
    como_verificar: Buscar tecnologías, componentes o decisiones de implementación impuestas en el enunciado (tablas, servicios, librerías, pantallas concretas).
    ejemplo_cumple: Como cliente, quiero ver mis movimientos recientes sin esperar, para revisar mis gastos al momento.
    ejemplo_no_cumple: Como cliente, quiero que los movimientos se lean de una caché Redis, para verlos rápido.
    severidad: menor
    aplica_a: [todos]
    estado: activo

  - id: QUS-006
    categoria: qus
    nombre: No ambigua
    descripcion: La HU no admite interpretaciones distintas; evita términos vagos sin medida ("rápido", "fácil", "mejor", "etc.").
    como_verificar: Subrayar adjetivos y adverbios vagos. Si no hay una medida o un criterio que los concrete, no cumple.
    ejemplo_cumple: Como cliente, quiero que el inicio de sesión tarde menos de 3 segundos con red 4G, para no abandonar la app.
    ejemplo_no_cumple: Como usuario, quiero que la app sea más rápida.
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: QUS-007
    categoria: qus
    nombre: Sin conflictos
    descripcion: La HU no contradice a otra HU del backlog ni una regla ya establecida.
    como_verificar: Buscar HU similares en el backlog y comparar comportamientos. Si una exige lo contrario que otra (por ejemplo, desactivar un control que otra exige), no cumple.
    ejemplo_cumple: Como cliente, quiero elegir entre huella o reconocimiento facial, para ingresar con el método que prefiera.
    ejemplo_no_cumple: Como cliente, quiero ingresar solo con un PIN de 4 dígitos sin biometría ni contraseña (cuando otra HU exige biometría o contraseña).
    severidad: bloqueante
    aplica_a: [todos]
    estado: activo

  - id: QUS-008
    categoria: qus
    nombre: Única
    descripcion: La HU no está duplicada; no existe otra HU con el mismo rol, acción y beneficio.
    como_verificar: Buscar HU similares. Si otra HU (con otro id) dice lo mismo con otras palabras, no cumple.
    ejemplo_cumple: Una sola HU para el ingreso con biometría.
    ejemplo_no_cumple: Dos HU distintas que piden ingresar con huella o rostro para no escribir la contraseña.
    severidad: bloqueante
    aplica_a: [todos]
    estado: activo

  - id: QUS-009
    categoria: qus
    nombre: Uniforme
    descripcion: La HU sigue el mismo formato que el resto del backlog del proyecto.
    como_verificar: Comparar la estructura con las HU similares. Si usa otra plantilla o mezcla idiomas sin motivo, no cumple.
    ejemplo_cumple: Como cliente, quiero pagar un servicio, para no ir a una agencia.
    ejemplo_no_cumple: "Pago de servicios: el sistema debe permitir pagar (requerimiento 4.2.1)."
    severidad: menor
    aplica_a: [todos]
    estado: activo

  # ------------------------------------------------------------------ INVEST (Wake, 2003)
  - id: INV-001
    categoria: invest
    nombre: Independiente
    descripcion: La HU puede desarrollarse y entregarse sin esperar a otra HU que no esté lista.
    como_verificar: Buscar referencias a otras HU, pantallas o funcionalidades que todavía no existen. Si depende de algo no planificado, no cumple.
    ejemplo_cumple: Como cliente, quiero ver el detalle de un movimiento, para confirmar el comercio y el monto.
    ejemplo_no_cumple: Como cliente, quiero ver el detalle del movimiento en la nueva pantalla de inversiones (que aún no existe).
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: INV-002
    categoria: invest
    nombre: Valiosa
    descripcion: El beneficio para el usuario o el negocio es explícito (la parte "para…").
    como_verificar: Verificar que exista el beneficio y que tenga valor para alguien distinto del equipo de desarrollo.
    ejemplo_cumple: Como cliente, quiero pagar con QR, para no cargar efectivo.
    ejemplo_no_cumple: Como cliente, quiero pagar con QR.
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: INV-003
    categoria: invest
    nombre: Estimable
    descripcion: El equipo tiene información suficiente para estimar el esfuerzo.
    como_verificar: Preguntarse si un equipo podría asignar story points sin hacer preguntas de alcance. Si faltan reglas, montos, integraciones o alcance, no cumple.
    ejemplo_cumple: Como cliente, quiero programar una transferencia a una fecha futura de hasta 90 días, para pagar a tiempo sin acordarme.
    ejemplo_no_cumple: Como cliente, quiero programar transferencias, para pagar a tiempo.
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: INV-004
    categoria: invest
    nombre: Pequeña
    descripcion: La HU cabe en un sprint; en la escala del proyecto, 8 story points o menos. Si es más grande, se divide.
    como_verificar: Estimar con historias de referencia. Si la estimación supera 8 puntos, no cumple y la decisión es dividir.
    ejemplo_cumple: Como cliente, quiero descargar el comprobante de una transferencia en PDF, para enviarlo a quien le pagué.
    ejemplo_no_cumple: Como cliente, quiero una nueva sección de inversiones con fondos, bonos y simulador.
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: INV-005
    categoria: invest
    nombre: Verificable
    descripcion: La HU tiene criterios de aceptación que permiten comprobar, sin interpretación, si está terminada.
    como_verificar: Verificar que existan criterios de aceptación concretos (idealmente en Gherkin Dado/Cuando/Entonces) con resultados observables.
    ejemplo_cumple: "Dado que el cliente tiene saldo suficiente, cuando confirma la transferencia, entonces ve el comprobante con número de referencia."
    ejemplo_no_cumple: La transferencia debe funcionar bien.
    severidad: bloqueante
    aplica_a: [todos]
    estado: activo

  # ------------------------------------------------------------------ DoR (borrador del equipo)
  - id: DOR-001
    categoria: dor
    nombre: Dependencias identificadas
    descripcion: Se nombran las dependencias externas necesarias (otros sistemas, equipos, proveedores, servicios del core).
    como_verificar: Si la HU requiere datos o servicios de otro sistema, verificar que se mencionen. Si la integración es evidente y no se menciona, no cumple.
    ejemplo_cumple: Como cliente, quiero ver el tipo de cambio del día, obtenido del servicio de tesorería, para decidir cuándo comprar dólares.
    ejemplo_no_cumple: Como cliente, quiero comprar dólares al tipo de cambio actual (sin indicar de dónde sale el tipo de cambio).
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: DOR-002
    categoria: dor
    nombre: Reglas de negocio explícitas
    descripcion: Los límites, montos, horarios, validaciones y casos de error relevantes están definidos, en la HU o en sus criterios de aceptación.
    como_verificar: Buscar operaciones con límites o validaciones implícitas (montos máximos, horarios, cantidad de intentos). Si no están definidos, no cumple.
    ejemplo_cumple: Transferencias a terceros de hasta [MONTO] diarios; al superar el límite se muestra un mensaje y no se procesa.
    ejemplo_no_cumple: Como cliente, quiero transferir a terceros (sin límites ni validaciones).
    severidad: mayor
    aplica_a: [todos]
    estado: activo

  - id: DOR-003
    categoria: dor
    nombre: Requisitos no funcionales declarados
    descripcion: Cuando aplican, se declaran rendimiento, disponibilidad, seguridad o volumen esperado.
    como_verificar: Si la funcionalidad es crítica o de alto volumen, verificar que haya al menos un requisito no funcional medible.
    ejemplo_cumple: La consulta de saldo responde en menos de 2 segundos para el 95 % de las solicitudes.
    ejemplo_no_cumple: Consulta de saldo en tiempo real (sin tiempos, volumen ni disponibilidad).
    severidad: menor
    aplica_a: [todos]
    estado: activo

  # ------------------------------------------------------------------ Banca móvil
  - id: BM-001
    categoria: banca_movil
    nombre: Autenticación y MFA
    descripcion: Las operaciones sensibles (transferencias, cambio de datos, alta de dispositivos) definen el factor de autenticación requerido, incluido el segundo factor (MFA) o la reautenticación.
    como_verificar: Si la HU incluye una operación sensible, verificar que diga cómo se autentica o confirma. No cumple si debilita la autenticación existente.
    ejemplo_cumple: Para agregar una cuenta favorita, el cliente confirma con biometría o con un código de un solo uso.
    ejemplo_no_cumple: Como cliente, quiero ingresar solo con un PIN de 4 dígitos, sin biometría ni contraseña.
    severidad: bloqueante
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-002
    categoria: banca_movil
    nombre: Manejo de sesión
    descripcion: Se define el comportamiento de la sesión cuando la HU la afecta (expiración por inactividad, cierre, sesión en segundo plano, varios dispositivos).
    como_verificar: Si la HU cambia el ingreso, la navegación prolongada o el uso en segundo plano, verificar que defina la sesión.
    ejemplo_cumple: La sesión expira tras 5 minutos de inactividad y pide reautenticación.
    ejemplo_no_cumple: Como cliente, quiero mantener la sesión abierta siempre, para no volver a ingresar.
    severidad: mayor
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-003
    categoria: banca_movil
    nombre: Enmascarado de datos sensibles
    descripcion: Los datos sensibles (números de cuenta y tarjeta, identificación, saldos en notificaciones) se muestran enmascarados en pantalla, notificaciones y registros.
    como_verificar: Si la HU muestra, envía o registra datos sensibles, verificar que defina el enmascarado.
    ejemplo_cumple: La notificación muestra la cuenta como ****1234 y no incluye el saldo.
    ejemplo_no_cumple: La notificación push muestra el número de cuenta completo y el saldo disponible.
    severidad: bloqueante
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-004
    categoria: banca_movil
    nombre: Seguridad de la app móvil (OWASP MASVS)
    descripcion: La HU respeta los controles de seguridad para apps móviles de OWASP MASVS cuando aplican (almacenamiento local, comunicación de red, plataforma, resiliencia).
    como_verificar: Si la HU guarda datos en el dispositivo, abre comunicaciones o usa funciones de la plataforma, verificar que no contradiga los controles (por ejemplo, no guardar credenciales en texto plano).
    ejemplo_cumple: El token de sesión se guarda en el almacén seguro del sistema operativo (Keychain o Keystore).
    ejemplo_no_cumple: Guardar el usuario y la contraseña en las preferencias de la app para ingresar más rápido.
    severidad: mayor
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-005
    categoria: banca_movil
    nombre: Trazabilidad y auditoría
    descripcion: Las operaciones monetarias o de cambio de datos definen qué eventos se registran para auditoría (quién, qué, cuándo, desde qué dispositivo), sin registrar datos sensibles en claro.
    como_verificar: Si la HU incluye una operación monetaria o un cambio de datos del cliente, verificar que mencione el registro de auditoría.
    ejemplo_cumple: Cada cambio de límite diario queda registrado con usuario, fecha, valor anterior, valor nuevo e identificador del dispositivo.
    ejemplo_no_cumple: Como cliente, quiero cambiar mi límite diario de transferencias (sin mencionar registro alguno).
    severidad: mayor
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-006
    categoria: banca_movil
    nombre: Accesibilidad
    descripcion: Las pantallas nuevas o modificadas consideran accesibilidad (lectores de pantalla, contraste, tamaño de texto), con WCAG 2.1 nivel AA como referencia.
    como_verificar: Si la HU crea o cambia una pantalla, verificar que mencione accesibilidad o que la DoR del equipo la incluya por defecto.
    ejemplo_cumple: Todos los botones tienen etiqueta para lector de pantalla y el texto respeta el tamaño configurado en el sistema.
    ejemplo_no_cumple: Nueva pantalla de pagos con íconos sin texto y colores definidos solo por diseño.
    severidad: menor
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-007
    categoria: banca_movil
    nombre: Comportamiento sin conexión y errores
    descripcion: Se define qué pasa sin conexión, con red lenta, con tiempo de espera agotado o con error del servicio, y cómo se evita duplicar operaciones.
    como_verificar: Si la HU depende de la red (casi todas), verificar que defina al menos el caso de error y, en operaciones monetarias, la idempotencia (no cobrar dos veces).
    ejemplo_cumple: Si la confirmación de un pago no llega, la app consulta el estado antes de permitir reintentar, para no pagar dos veces.
    ejemplo_no_cumple: Como cliente, quiero pagar servicios (sin definir qué pasa si se cae la conexión al confirmar).
    severidad: mayor
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-008
    categoria: banca_movil
    nombre: Plataformas iOS y Android
    descripcion: Se indican las plataformas y versiones mínimas, y las diferencias de comportamiento entre iOS y Android cuando existen.
    como_verificar: Si la HU usa funciones del dispositivo (biometría, notificaciones, cámara, NFC), verificar que considere las dos plataformas.
    ejemplo_cumple: El ingreso con rostro usa Face ID en iOS y la biometría de clase fuerte en Android; si no está disponible, se ofrece la contraseña.
    ejemplo_no_cumple: Ingreso con Face ID (sin mencionar Android).
    severidad: menor
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-009
    categoria: banca_movil
    nombre: Protección de datos personales (Ley 8968)
    descripcion: Si la HU recolecta, usa o comparte datos personales, define la finalidad, el consentimiento y la minimización, según la Ley 8968 de Protección de la Persona frente al Tratamiento de sus Datos Personales de Costa Rica.
    como_verificar: Si aparecen datos personales nuevos (ubicación, contactos, fotos, datos biométricos), verificar que se indique para qué se usan, que se pida consentimiento y que no se recolecte más de lo necesario.
    ejemplo_cumple: La app pide permiso para usar la ubicación solo al buscar agencias cercanas y explica para qué la usa.
    ejemplo_no_cumple: La app sube la lista de contactos del teléfono para sugerir destinatarios, sin pedir consentimiento.
    severidad: bloqueante
    aplica_a: [banca_movil]
    estado: activo

  - id: BM-010
    categoria: banca_movil
    nombre: Cumplimiento normativo SUGEF
    descripcion: Las operaciones financieras respetan la normativa de la SUGEF aplicable (por ejemplo, límites transaccionales, información al cliente y gestión de tecnología de información). La norma concreta la confirma el área de Cumplimiento.
    como_verificar: Si la HU crea o cambia una operación financiera o la información que se da al cliente, verificar que mencione la validación con Cumplimiento o la regla normativa aplicable.
    ejemplo_cumple: El nuevo límite de transferencias se valida con Cumplimiento antes de pasar a la fábrica.
    ejemplo_no_cumple: Como cliente, quiero transferir sin límite diario.
    severidad: mayor
    aplica_a: [banca_movil]
    estado: activo
